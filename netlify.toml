[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Prerendered per-route HTML is served directly (Netlify serves existing files
# before applying this fallback). The fallback only catches client-side routes
# that have no prerendered file.
# The June 2026 World Cup window is over; the page is gone. Must sit BEFORE
# the SPA catch-all or it never matches.
[[redirects]]
  from = "/world-cup"
  to = "/events"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# Security headers. Allowlist matches the site's real external surface:
# Google Fonts (css+woff2), the Google Maps embed, the Untappd menu embed,
# Google-hosted review avatars, and same-origin Netlify functions. HSTS is
# left to Netlify's platform default.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://embed-menu-preloader.untappdapi.com https://*.untappd.com https://*.untappdapi.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.untappdapi.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.google.com https://maps.google.com https://*.untappd.com; connect-src 'self' https://*.untappdapi.com https://*.untappd.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[functions]
  directory = "netlify/functions"
