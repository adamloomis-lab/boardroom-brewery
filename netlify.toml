[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Prerendered per-route HTML is served directly (Netlify serves existing files
# before applying this fallback). The fallback only catches client-side routes
# that have no prerendered file.
# The June 2026 World Cup window is over; the page is gone. Must sit BEFORE
# the SPA catch-all or it never matches.
[[redirects]]
  from = "/world-cup"
  to = "/events"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[functions]
  directory = "netlify/functions"
